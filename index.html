<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPM</title>
<meta name="description" content="教材の回転数と忘却曲線にもとづいて、今日やる量を出す学習アプリ">
<meta name="theme-color" content="#2F4FD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RPM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
  // 画面の明るさ（標準は明るい）。描画の前に決めて、ちらつかないようにする
  try { document.documentElement.dataset.theme = localStorage.getItem('rpm-theme') || 'light'; }
  catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
</head>
<body>
<div class="wrap" id="app"><div class="note">読み込み中です…</div></div>
<div class="toast" id="toast" hidden></div>
<noscript><p>RPM を使うには JavaScript を有効にしてください。</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
